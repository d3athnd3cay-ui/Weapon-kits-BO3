name: Windows C++17 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-dll:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source contract checks
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $output = python -m unittest discover -s tests -p "test_*.py" -v 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $message = ($output | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Source contract tests failed::$message"
            exit $code
          }
      - name: Compile and run native tests, then build the DLL
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'weapon-kits-build.txt'
          $failed = $false
          try {
            ./Build-Local.ps1 -Jobs 2 *>&1 | Tee-Object -FilePath $log
          } catch {
            $failed = $true
            $_ | Out-String | Tee-Object -FilePath $log -Append
          } finally {
            '## Windows C++17 build output' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            if (Test-Path $log) {
              Get-Content $log -Tail 180 | Out-File $env:GITHUB_STEP_SUMMARY -Append
            }
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          if ($failed) {
            $lines = @(Get-Content $log -Tail 180)
            $errors = @($lines | Where-Object { $_ -match '(?i)error|fatal|exception|command failed' })
            if ($errors.Count -eq 0) { $errors = $lines | Select-Object -Last 35 }
            $message = ($errors -join "`n")
            if ($message.Length -gt 8000) { $message = $message.Substring($message.Length - 8000) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows C++ build failed::$message"
            exit 1
          }
      - name: Save DLL and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: WeaponKitsBO3-v36-Windows-x64
          if-no-files-found: error
          path: |
            build/bin/WeaponKitsBO3.v36.dll
            build/bin/WeaponKitsBO3.v36.dll.sha256
            build/bin/headers.txt
            build/bin/imports.txt
            build/bin/build-report.txt
            build/tests/results.txt
